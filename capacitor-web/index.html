<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>WhatsApp Viewer</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ece5dd; color: #111b21; text-align: center; padding: 24px;
      }
      @media (prefers-color-scheme: dark) { body { background: #0b141a; color: #e9edef; } }
      .logo {
        width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 16px;
        background: #25d366; display: grid; place-items: center; font-size: 36px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; opacity: 0.75; max-width: 34ch; margin: 0 auto; line-height: 1.5; }
      button {
        margin-top: 20px; padding: 10px 22px; border: 0; border-radius: 999px;
        background: #25d366; color: #062e19; font-weight: 600; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">💬</div>
      <h1>WhatsApp Viewer</h1>
      <p id="msg">Connecting to your chat server…</p>
      <button id="retry" hidden type="button">Try again</button>
    </main>
    <script>
      var msg = document.getElementById('msg')
      var retry = document.getElementById('retry')
      function check() {
        if (navigator.onLine) {
          msg.textContent = 'Connected — loading your chats…'
        } else {
          msg.textContent =
            "You're offline. The app needs a connection to reach your chat server."
          retry.hidden = false
        }
      }
      retry.addEventListener('click', function () { location.reload() })
      window.addEventListener('online', check)
      window.addEventListener('offline', check)
      check()
    </script>
  </body>
</html>
