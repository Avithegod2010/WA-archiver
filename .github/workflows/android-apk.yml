name: Build Android APK

# Builds a ready-to-install STANDALONE debug APK on every push to main (and
# on demand). The APK bundles the whole web app (static export) and the
# on-device SQLite database — it works with no internet and no hosted URL.
# Download it from the run's "Artifacts" section → whatsapp-viewer-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Phase 3: the APK no longer points at a hosted URL — it BUNDLES the
      # app. This static-exports the frontend into capacitor-web/ (device
      # transport only; API routes are excluded from the bundle on purpose).
      - name: Build web bundle (static export)
        run: bun run build:capacitor

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor (web assets + config into Android)
        run: bunx cap sync android

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-viewer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
