name: Build Android APK

# Builds a ready-to-install STANDALONE APK and attaches it to GitHub Releases:
#   • push a tag (v1.2.3…)    → versioned Release with a SIGNED release APK
#   • push to main            → refreshes the rolling "latest" pre-release (debug APK)
#   • workflow_dispatch       → refreshes the rolling "latest" pre-release
#
# Signing: tags build `assembleRelease` signed with the KEYSTORE_BASE64 /
# KEYSTORE_PASSWORD / KEYSTORE_ALIAS Actions secrets (see android/app/build.gradle).
# If the secrets are absent the release build falls back to the debug key, so the
# pipeline never breaks. main pushes build the plain debug APK.
#
# The APK bundles the whole web app (static export) and the on-device SQLite
# database — it works with no internet and no hosted URL. Users download it
# from the Releases page, not from CI logs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Phase 3: the APK no longer points at a hosted URL — it BUNDLES the
      # app. This static-exports the frontend into capacitor-web/ (device
      # transport only; API routes are excluded from the bundle on purpose).
      - name: Build web bundle (static export)
        run: bun run build:capacitor

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor (web assets + config into Android)
        run: bunx cap sync android

      - name: Prepare signing key (versioned releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/whatsapp-viewer.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/whatsapp-viewer.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }}" >> "$GITHUB_ENV"
            echo "Signing key ready (release build will be signed)."
          else
            echo "KEYSTORE_BASE64 secret not set — release APK will use the debug key."
          fi

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Name the APKs (universal + per-ABI)
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p apk-out
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # ABI splits (v1.6.0): assembleRelease emits one APK per ABI plus
            # the universal build. Attach all of them to the versioned Release.
            SRC_DIR=android/app/build/outputs/apk/release
            if [ -z "$(ls "$SRC_DIR"/*.apk 2>/dev/null)" ]; then
              echo "Release APKs missing — falling back to debug APKs"
              SRC_DIR=android/app/build/outputs/apk/debug
            fi
            for f in "$SRC_DIR"/*.apk; do
              base=$(basename "$f")   # app-universal-release.apk | app-arm64-v8a-release.apk | …
              variant=${base#app-}    # universal-release.apk | arm64-v8a-release.apk | …
              variant=${variant%.apk} # universal-release    | arm64-v8a-release    | …
              cp "$f" "apk-out/WA-Archiver-${GITHUB_REF#refs/tags/}-${variant}.apk"
            done
          else
            # Rolling "latest" build: only the universal debug APK keeps the
            # pre-release tidy (per-ABI debug builds add noise, not value).
            SRC=android/app/build/outputs/apk/debug/app-universal-debug.apk
            [ -f "$SRC" ] || SRC=android/app/build/outputs/apk/debug/app-debug.apk
            [ -f "$SRC" ] || SRC=$(ls android/app/build/outputs/apk/debug/*universal*.apk 2>/dev/null | head -1)
            cp "$SRC" "apk-out/WA-Archiver-v${VERSION}-debug-${GITHUB_SHA::7}.apk"
          fi
          ls -la apk-out
          echo "dir=apk-out" >> "$GITHUB_OUTPUT"

      # Tag builds: pull the body of this version's section out of
      # CHANGELOG.md (Keep-a-Changelog: "## [1.4.0] — 2026-10-19" … until the
      # next "## [" heading) so the GitHub Release shows the real changelog
      # instead of a generic "Full Changelog" link. Empty output (no matching
      # section) → the release step falls back to --generate-notes.
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          VERSION="${GITHUB_REF#refs/tags/v}"
          awk -v marker="## [$VERSION]" '
            index($0, marker) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md || true
          # Trim leading/trailing blank lines; the body stays verbatim.
          sed -i -e '/./,$!d' release-notes.md
          sed -i -e ':a' -e '/^[[:space:]]*$/{$d;N;ba' -e '}' release-notes.md
          if [[ -s release-notes.md ]]; then
            echo "Release notes: CHANGELOG section for $VERSION ($(wc -l < release-notes.md) lines)"
          else
            echo "No CHANGELOG section for $VERSION — release will use auto-generated notes"
          fi

      - name: Attach APKs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          APK_DIR="${{ steps.apk.outputs.dir }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Attaching $(ls "$APK_DIR" | wc -l) APK(s) to versioned release $TAG"
            # Prefer the CHANGELOG section for this version (release-notes.md,
            # written by the extract step above); fall back to GitHub's
            # auto-generated notes when there is no matching entry.
            if [[ -s release-notes.md ]]; then
              gh release create "$TAG" \
                --title "WA Archiver $TAG" \
                --notes-file release-notes.md \
                "$APK_DIR"/*
            else
              gh release create "$TAG" \
                --title "WA Archiver $TAG" \
                --generate-notes \
                "$APK_DIR"/*
            fi
          else
            TAG="latest"
            TITLE="Latest APK (auto-build)"
            NOTES=$(printf '%s\n' \
              "Automated APK build of commit \`$GITHUB_SHA\` ($(date -u +'%Y-%m-%d %H:%M UTC'))." \
              "" \
              "**Install:** download the APK below → allow \"install unknown apps\" for your browser → open the APK." \
              "" \
              "- Works fully offline — chats live on-device, voice notes transcribe on the phone." \
              "- AI tools are optional: add your own free [Gemini API key](https://aistudio.google.com/apikey) in Settings → AI." \
              "" \
              "> This rolling release is overwritten on every push to \`main\`." \
              "> For stable builds, check the [versioned releases](https://github.com/${GITHUB_REPOSITORY}/releases).")
            if gh release view "$TAG" >/dev/null 2>&1; then
              # purge stale APK assets so the rolling release keeps only the newest build
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null |
                while IFS= read -r asset; do
                  [ -n "$asset" ] && gh release delete-asset "$TAG" "$asset" -y || true
                done
              gh release upload "$TAG" "$APK_DIR"/* --clobber
              gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --prerelease
            else
              gh release create "$TAG" \
                --title "$TITLE" \
                --notes "$NOTES" \
                --prerelease \
                "$APK_DIR"/*
            fi
          fi

      - name: Upload APK artifact (short-lived convenience copy)
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-viewer-apk
          path: apk-out
          if-no-files-found: error
          retention-days: 7
