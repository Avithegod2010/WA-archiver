name: PR quality gate

# Runs on every pull request targeting the release or development branches.
# A PR may only be merged when lint, TypeScript and the full static build pass.

on:
  pull_request:
    branches: [beta, main, stable]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: TypeScript check
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Build (static export — same pipeline as the Android APK)
        run: bun run build:capacitor
