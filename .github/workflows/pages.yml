name: Deploy site (landing + web app)

# Builds and deploys the GitHub Pages site in one workflow:
#   • /                ← the landing page (website/)
#   • /app/            ← the FULL app, statically exported (device transport:
#                        SQLite-WASM + OPFS in the browser, no server needed)
# Nothing to enable by hand — configure-pages flips Pages on automatically
# (build_type: workflow). Deploys on every push to main.
#
# Data-safety: the hosted app is the same local-first bundle as the APK —
# chat data lives in the visitor's browser (OPFS), never on a server.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build landing + static app export
        run: bun run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
