version: 2
updates:
  # GitHub Actions used by the workflows — Dependabot handles these well.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # NOTE: JS dependencies are NOT managed by Dependabot — this repo locks
  # dependencies with Bun (bun.lock), which Dependabot's npm updater cannot
  # parse (every run errors with "Bun is misconfigured"). Update JS deps via:
  #   bun update && bun run build:capacitor && bun run lint
  # (the beta branch carries dependency bumps first, e.g. the sharp 0.34.x bump
  # that superseded Dependabot PR #1's original attempt)
