name: 💡 Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas live on the **beta** branch and are tracked from the roadmap.
        Small, focused suggestions get implemented fastest.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that feels missing or clunky.
      placeholder: I have 30 chats and can't tell which ones had the most voice notes at a glance…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your ideal solution
      description: How would you picture it in the UI?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Which area is this about?
      options:
        - label: Import / export / backup
        - label: Chat reading & search
        - label: Media & voice notes
        - label: Stats / insights
        - label: AI tools
        - label: Android APK / PWA
        - label: Privacy & security
        - label: Something else
